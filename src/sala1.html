<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sala 1</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat { border:1px solid #aaa; height:300px; overflow-y:auto; padding:5px; }
    #chat div { margin: 5px 0; padding: 4px 8px; border-radius: 5px; max-width: 80%; }
    .me { background-color: #DCF8C6; margin-left: auto; }
    .other { background-color: #F1F0F0; margin-right: auto; }
    #input-container { margin-top:10px; display: flex; }
    #msg { flex: 1; padding:5px; }
    button { padding: 5px 10px; margin-left:5px; }
  </style>
  <a href="index.html">Portal de Xats</a>
</head>
<body>

<h3>Sala 1</h3>
<div id="chat"></div>

<div id="input-container">
  <input id="msg" placeholder="Escribe..." autofocus>
  <button onclick="send()">Enviar</button>
</div>

<script>
const username = prompt("Quin es el teu nom?") || "Anonimo";
const sala = "sala1";
const protocol = location.protocol === "https:" ? "wss" : "ws";
const ws = new WebSocket(`${protocol}://${location.host}`);

ws.onopen = () => {
  ws.send(JSON.stringify({ type: "join", sala }));
};

ws.onmessage = (ev) => {
  const data = JSON.parse(ev.data);
  if (data.type === "message") {
    const div = document.getElementById("chat");
    const msgDiv = document.createElement("div");
    msgDiv.className = data.user === username ? "me" : "other";
    msgDiv.innerHTML = `<strong>${data.user}</strong> [${data.time}]: ${data.text}`;
    div.appendChild(msgDiv);
    div.scrollTop = div.scrollHeight;
  }
};

function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;
  const time = new Date().toLocaleTimeString();
  ws.send(JSON.stringify({ type: "message", sala, user: username, time, text }));
  input.value = "";
}

document.getElementById("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
